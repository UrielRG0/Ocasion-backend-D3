name: Dominio 3 - Pruebas, Build y Deploy

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Dar permiso a mvnw y correr pruebas unitarias + empaquetado
        run: |
          chmod +x mvnw
          ./mvnw clean package
        env:
          SPRING_PROFILES_ACTIVE: test
          DOMINIO1_URL: http://localhost:8080
          DOMINIO1_LOGIN_PATH: /api/v1/auth/login
          D1_ADMIN_EMAIL: ci-test@ocasion.local
          D1_ADMIN_PASS: ci-test-pass
          PAYPAL_CLIENT_ID: ci-paypal-id
          PAYPAL_CLIENT_SECRET: ci-paypal-secret
          PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
          JWT_SECRET: Y2ktc2VjcmV0LWtleS1mb3ItZ2l0aHViLWFjdGlvbnMtMTIzNDU2Nzg5MA==

      - name: Probar build de Docker (si existe Dockerfile)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t ocasion-dom3:ci .
          else
            echo "Aún no hay Dockerfile; se omite build de imagen."
          fi

  deploy:
    needs: pruebas-y-build
    # Solo despliega cuando haces push directo a main y si las pruebas/build pasaron
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Paso de deploy (configurar destino real)
        run: |
          echo "Listo para desplegar Dominio 3 desde main."
          # Aquí se conecta tu despliegue real (SSH/Docker en servidor o webhook de plataforma)